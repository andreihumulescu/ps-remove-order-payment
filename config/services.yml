services:
  _defaults:
    public: true

  PrestaShop\Module\RemoveOrderPayment\Domain\Order\CommandHandler\UpdateOrderTotalPaidRealHandler:
    arguments:
      - '@prestashop.adapter.legacy.configuration'
    tags:
      - name: 'tactician.handler'
        command: 'PrestaShop\Module\RemoveOrderPayment\Domain\Order\Command\UpdateOrderTotalPaidRealCommand'
      - name: 'messenger.message_handler'
        method: 'handle'

  order_payment.repository:
    class: PrestaShop\Module\RemoveOrderPayment\Repository\OrderPaymentRepository
    arguments:
      - '@doctrine.dbal.default_connection'
      - '%database_prefix%'

  remove_order_payment.service.date_format_service:
    class: PrestaShop\Module\RemoveOrderPayment\Service\DateFormatService
    arguments:
      - "@=service('prestashop.adapter.legacy.context').getContext().language.date_format_full"

  PrestaShop\Module\RemoveOrderPayment\Controller\Admin\RemovePaymentController:
    arguments:
      - '@remove_order_payment.service.date_format_service'
      - '@order_payment.repository'
